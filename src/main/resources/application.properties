# Application Configuration
spring.application.name=ids-ia
server.port=${SERVER_PORT:8080}

# Database Configuration (PostgreSQL)
# Configure these values with your actual AWS RDS PostgreSQL instance details
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ids_database}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Connection Pool Configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# Ensure data.sql runs on startup (non-embedded DB)
spring.sql.init.mode=always
# Make sure JPA creates/updates tables before running data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# Kafka Configuration
# Configure these values with your actual AWS MSK (Managed Streaming for Kafka) details
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=ids-consumer-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer  
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.arsw.ids_ia

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:defaultpassword}

# JWT Configuration (single source of truth)
app.jwt.secret=${APP_JWT_SECRET:b49e6f1b4f4e4a7b9c1d2e3f4a5b6c7d8e9f0123456789abcdef0123456789ab}
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000}
app.jwt.refresh-expiration=${APP_JWT_REFRESH_EXPIRATION:1209600000}

# Frontend URL for OAuth2 redirect completion
# Default to 'none' so that when no frontend is running, backend returns JSON with tokens
app.frontend.url=${APP_FRONTEND_URL:none}

# Google OAuth2 Client (provide via environment variables)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# Actuator Configuration (for health checks)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Logging Configuration
logging.level.com.arsw.ids_ia=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.kafka=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/ids-application.log
